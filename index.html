/* Layout: one locked portrait column — active combatant as a large card, the rest of the turn order below */
:root{
  --bg:#14110f; --panel:#1f1a17; --line:#3a312b; --fg:#efe6dc; --muted:#a3968a;
  --accent:#d9a441; --hp:#6fbf73; --hpbase:#efe6dc; --temp:#cfeaff; --tempglow:rgba(120,190,255,.75); --hurt:#e0803c; --crit:#d9534f; --monster:#8f6cc4;
  /* every colour of the app is a token: a skin only redefines this list */
  --zone:#1a1613; --chip:#2c2521; --onaccent:#1b140c; --oncrit:#fff; --conc:#5b8fd6; --monsterfg:#d8c6f2; --scrim:rgba(0,0,0,.6);
  --w1:#e6c84a; --w2:#e8893a; --w3:#d9534f; --w4:#ff2e2e; --glow:rgba(255,46,46,.8);
  --display:"Alegreya SC", Georgia, serif; --ui:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
/* ---- skins: copy a block, rename it, change the values ---- */
:root[data-skin="parchment"]{
  --bg:#efe4cc; --panel:#f8f0de; --line:#cdb994; --fg:#2b2117; --muted:#7a6a55; --accent:#8a3b12; --hp:#3f7d3a; --hpbase:#2b2117;
  --temp:#1f6fb5; --tempglow:rgba(31,111,181,.35); --hurt:#b8661f; --crit:#a3261d; --monster:#5b3a8a;
  --zone:#efe2c6; --chip:#e8d9b8; --onaccent:#fdf6e6; --oncrit:#fff; --conc:#1f6fb5; --monsterfg:#5b3a8a; --scrim:rgba(43,33,23,.45);
  --w1:#b08a12; --w2:#c0621a; --w3:#a3261d; --w4:#d4140b; --glow:rgba(212,20,11,.35);
  color-scheme:light;
}
:root[data-skin="crimson"]{
  --bg:#0d0809; --panel:#1a0f11; --line:#3b1d22; --fg:#f1e3e3; --muted:#a88e91; --accent:#c4122f; --hp:#8fbf8a; --hpbase:#f1e3e3;
  --temp:#bfe4ff; --tempglow:rgba(150,200,255,.7); --hurt:#d85a3a; --crit:#e0233f; --monster:#7d5aa8;
  --zone:#140b0d; --chip:#2a1418; --onaccent:#fff3f3; --oncrit:#fff; --conc:#6b8fd6; --monsterfg:#e2d0f5; --scrim:rgba(0,0,0,.7);
  --w1:#e8c46a; --w2:#e6803c; --w3:#d6334a; --w4:#ff1f3d; --glow:rgba(255,31,61,.85);
}
/* Gilded Night: navy + thin gold double frames with small corner flourishes (colours and ornaments are tokens/masks) */
:root[data-skin="gilded"]{
  --bg:#0a0f2c; --panel:rgba(22,30,78,.78); --line:rgba(216,181,106,.35); --fg:#f1ead6; --muted:#a9a8c9; --accent:#d8b56a; --hp:#9fd6a6; --hpbase:#f1ead6;
  --temp:#d9f1ff; --tempglow:rgba(160,215,255,.8); --hurt:#e39a4a; --crit:#e2584f; --monster:#9b7ad6;
  --zone:transparent; --chip:rgba(216,181,106,.14); --onaccent:#0a0f2c; --oncrit:#fff; --conc:#8fb4ff; --monsterfg:#e6dbff; --scrim:rgba(4,6,20,.72);
  --w1:#ecd27a; --w2:#eb9a4c; --w3:#e2584f; --w4:#ff3b4d; --glow:rgba(255,59,77,.8);

}

:root[data-skin="gilded"] .ptile.act{background:var(--panelact);box-shadow:0 0 16px var(--goldsoft)}
:root[data-skin="gilded"] .ptile.act::after{background:var(--accent)}
:root[data-skin="gilded"] .ptile .phead{border-color:var(--goldsoft);padding-left:20px;padding-right:20px}
:root[data-skin="gilded"] .ptile>.in{padding:4px 6px}
:root[data-skin="gilded"] .ptile .val small{padding:0 14px}
.ptile{container-name:tile}
@container tile (max-height:96px){.ptile .bighp::before,.ptile .bighp::after{font-size:1.3rem}.ptile .bighp::before{left:5px}.ptile .bighp::after{right:5px}.ptile .bighp{padding:0 22px}}
@container (max-height:96px){:root[data-skin="gilded"] .ptile .phead{padding-left:10px;padding-right:4px;width:56%}:root[data-skin="gilded"] .ptile .val small{padding:0;white-space:nowrap}}
:root[data-skin="gilded"] .round,:root[data-skin="gilded"] .welcome h1{letter-spacing:.04em}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;width:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;max-width:430px;margin:0 auto;min-width:0}
#app>*{min-width:0;max-width:100%}
@media (orientation:landscape) and (max-height:600px){
  #app{position:fixed;top:50%;left:50%;width:100vh;height:100vw;max-width:none;transform:translate(-50%,-50%) rotate(-90deg);padding-inline:16px}
}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:8px}
.round{font-family:var(--display);font-size:1.15rem;color:var(--accent);flex:1}
.round b{font-variant-numeric:tabular-nums}
header button{padding:6px 10px;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
header button.on{border-color:var(--monster);color:var(--monsterfg)}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.card{flex-shrink:0;display:grid;grid-template-columns:38px minmax(0,1fr) auto;min-width:0;overflow:hidden;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.card.monster{border-left:4px solid var(--monster)}
.card.down{opacity:.6}
.init{font-size:1.4rem;font-weight:700;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.name{font-family:var(--display);font-size:1.1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:6px;background:var(--accent);color:var(--onaccent)}
.tag.bad{background:var(--dsfail,var(--crit));color:var(--oncrit)}.tag.conc{background:var(--conc);color:var(--oncrit)}
.active .tags{gap:6px}.active .tag{font-size:.95rem;padding:5px 11px}
.hpv{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.hpv small{color:var(--muted);font-weight:400;font-size:.8rem}
.bar{grid-column:1/-1;height:4px;background:var(--chip);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hp)}
/* active */
.active{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.active .top{display:flex;align-items:center;gap:10px;min-width:0}
.active .name{font-size:1.5rem;flex:1;min-width:0}
.active{min-width:0;overflow:hidden}
.tags{min-width:0}
header{min-width:0}header button{white-space:nowrap}
.active .lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.bighp{position:relative;display:block;width:100%;padding:18px 0;border-radius:12px;background:var(--zone);user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
.bighp::before,.bighp::after{position:absolute;top:50%;transform:translateY(-50%);font-size:1.9rem;color:var(--pm,var(--muted));font-weight:700;opacity:.9}
.bighp::before{content:"−";left:16px}.bighp::after{content:"+";right:16px}
.bighp .val{text-align:center;font-size:4.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--hpbase)}
.bighp .val small{display:block;font-size:.95rem;color:var(--muted);font-weight:400;margin-top:4px}
.val.has-temp,.hpv.has-temp{color:var(--temp)!important;text-shadow:0 0 14px var(--tempglow)}
.val.zero,.hpv.zero{color:var(--crit)!important}
.party{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.party{gap:6px;overflow-y:auto}
.ptile{min-height:52px;flex-shrink:1}
.hprow{flex:1;min-height:0;display:flex}.hprow .hpzone{flex:1;min-width:0}
.dcol{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;align-self:stretch;padding:4px 8px;flex:none}
.dcol.fails{border-right:3px solid var(--dsfail,var(--crit))}.dcol.succ{border-left:3px solid var(--dssucc,var(--hp))}
.ptile.down{opacity:1}.ptile.down .phead,.ptile.down .hpzone{opacity:.75}
.dcol .pip{width:min(22px,22cqh);height:min(22px,22cqh);flex:none}
.ptile.act{border:2px solid var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ptile.mon{border-left:4px solid var(--monster)}.ptile.mon.act{border-left-width:4px}
.ini{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.6em}
.ptile.act .ini{color:var(--accent)}
.turn{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--onaccent);border-radius:4px;padding:1px 6px}
.ptile{flex:1;min-height:0;container-type:size;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ptile>.in{height:100%;display:flex;flex-direction:row}
.ptile .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.ptile .phead{display:flex;flex-direction:column;gap:3px;padding:6px 10px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;text-align:left;width:100%;min-width:0}
.ptile .prow{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.ptile .phead .name{flex:1;min-width:0;font-size:1.05rem}
.ptile .phead .edit{color:var(--accent);font-size:.8rem;white-space:nowrap}
.ptile .tags{margin:0}.ptile .tag{font-size:.6rem;padding:1px 5px;letter-spacing:.04em;font-weight:600}
@container (max-height:96px){
  .ptile .mid{flex-direction:row}
  .ptile .phead{width:52%;flex:none;border-bottom:none;border-right:1px solid var(--line);justify-content:center;padding:4px 8px}
  .ptile .phead .name{font-size:.95rem}
  .ptile .tags{gap:2px}.ptile .tag{font-size:.58rem;padding:1px 4px;letter-spacing:.02em}
}
.ptile .hpzone{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;border-radius:0;padding:0;background:transparent}
.ptile .val{font-size:min(62cqh,4.6rem);line-height:1}
.ptile .val small{font-size:min(16cqh,.9rem);margin-top:2px}
.ptile.down{opacity:.7}
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:360px;margin:0 auto;width:100%}
.welcome h1{font-family:var(--display);color:var(--accent);font-size:2.4rem;margin:0;text-wrap:balance}
.welcome .lead{font-size:1.2rem;line-height:1.4;margin:0}
.welcome ul{margin:0 0 8px;padding-left:1.1em;color:var(--muted);line-height:1.5}
.tname{background:none;border:none;padding:0;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none!important;letter-spacing:0!important;font-size:1.15rem!important}
.tables{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;text-align:left;width:100%}
.trow .name{max-width:100%}
.chips{display:flex;gap:6px}.chips button{flex:1;padding:8px 0}.chips button.on{border-color:var(--accent);color:var(--accent);background:var(--chip)}
.psaves{gap:6px;padding:4px 8px;flex-wrap:nowrap;justify-content:center}.psaves .pip{width:22px;height:22px;flex:none}.psaves span{font-size:.7rem;margin-left:6px}

function registerMember(room){if(!FB)return;FB.fs.setDoc(FB.fs.doc(FB.db,"rooms",room,"p",deviceId()),{uid:FB.uid,t:Date.now()}).catch(e=>console.warn("member",e))}
function unregisterMember(room){if(!FB)return;FB.fs.deleteDoc(FB.fs.doc(FB.db,"rooms",room,"p",deviceId())).catch(()=>{})}
let memberWatch={};
function watchMembers(){if(!FB)return;const want=new Set(DB.parties.filter(p=>p.room).map(p=>p.room.id));
  for(const id of Object.keys(memberWatch))if(!want.has(id)){try{memberWatch[id]()}catch(e){}delete memberWatch[id]}
  for(const p of DB.parties)if(p.room&&!memberWatch[p.room.id]){const pid=p.id;
    memberWatch[p.room.id]=FB.fs.onSnapshot(FB.fs.collection(FB.db,"rooms",p.room.id,"p"),q=>{const t=DB.parties.find(x=>x.id===pid);if(!t)return;
      if(t.members!==q.size){t.members=q.size;save();if(!sheet||sheet==="table")render()}},()=>{})}}
function joined(){try{return JSON.parse(localStorage.getItem(KEY+"-joined")||"[]")}catch(e){return []}}
function saveJoined(l){try{localStorage.setItem(KEY+"-joined",JSON.stringify(l.slice(0,30)))}catch(e){}}
function rememberJoined(id,name){const l=joined().filter(j=>j.id!==id);const old=joined().find(j=>j.id===id);if(!old)stat("joins");l.unshift({id,name:name||old?.name||""});saveJoined(l)}
function openJoined(id){rememberJoined(id);ROLE="player";lastSent={};lastMeta="";sheet=null;PS.list=[];connectRoom(id);render()}
function goHome(){ROLE="gm";sheet=null;DB.cur=null;S=null;if(FB){const p=DB.parties.find(x=>x.live&&x.room);if(p)connectRoom(p.room.id);else disconnectRoom()}render()}
// A live table never switches itself off: if the GM's phone cannot reach its room, it retries,
// then shows "live sharing interrupted" with a reconnect button instead of failing silently.
async function ensureLive(p){if(!FB||!p||!p.live||!p.room)return;if(ROOM===p.room.id&&!p.liveErr)return;
  for(let i=0;i<3;i++){try{await claimRoom(p.room);p.liveErr=false;connectRoom(p.room.id);watchMembers();if(!sheet||sheet==="table")render();return}
    catch(e){console.warn("live reconnect",e);await new Promise(r=>setTimeout(r,1500*(i+1)))}}
  p.liveErr=true;if(!sheet||sheet==="table")render()}
// ---------- live status dot ----------
// green: up to date (and, for players, the GM is active) · orange: GM not active for 2+ min · grey: this phone is offline · red: GM sharing interrupted
let FROMCACHE=false,lastGmBeat=0,lastGmSeen=0,gmBeatT=null,statusT=null;
const isOffline=()=>!navigator.onLine||(FB&&ROOM&&FROMCACHE);
function gmAway(){return ROLE==="player"&&Date.now()-lastGmBeat>150000}
function statusDot(){if(isOffline())return `<span class="dot dot-off" title="Offline: this phone has no connection">●</span>`;
  if(ROLE!=="player"&&P()?.liveErr)return `<span class="dot dot-err" title="Live sharing interrupted">●</span>`;
  if(gmAway())return `<span class="dot dot-away" title="The GM has not been active for a few minutes">●</span>`;
  return `<span class="dot dot-ok" title="Live">●</span>`}
function statusLabel(){return isOffline()?` <span class="dotlbl">offline</span>`:(gmAway()?` <span class="dotlbl">GM away</span>`:"")}
function noteGmBeat(m){if(!m||!m.gmSeen||m.gmSeen===lastGmSeen)return;
  // first value seen: trust it only if recent (clock skew tolerated); later changes mean the GM is active right now
  if(lastGmSeen||Math.abs(Date.now()-m.gmSeen)<150000)lastGmBeat=Date.now();lastGmSeen=m.gmSeen}
function startBeats(){clearInterval(gmBeatT);clearInterval(statusT);gmBeatT=statusT=null;if(!FB||!ROOM)return;
  if(ROLE!=="player"){const room=ROOM;const beat=()=>{if(ROOM===room)FB.fs.setDoc(roomRef(room),{gmSeen:Date.now()},{merge:true}).catch(()=>{})};beat();gmBeatT=setInterval(beat,60000)}
  statusT=setInterval(()=>{if(!sheet)render()},30000)}
window.addEventListener("online",()=>{if(!sheet)render()});window.addEventListener("offline",()=>{if(!sheet)render()});
function connectRoom(id){if(!FB)return;lastGmBeat=0;lastGmSeen=0;FROMCACHE=false;ROOM=id;REM={meta:null,docs:[]};lastSent={};lastMeta="";subscribeRemote();if(ROLE==="player")registerMember(id);startBeats()}
function disconnectRoom(){clearInterval(gmBeatT);clearInterval(statusT);gmBeatT=statusT=null;unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];ROOM=null;REM={meta:null,docs:[]};lastSent={};lastMeta=""}
function joinUrl(id){return location.origin+location.pathname+"#join="+id}
function shareBlock(){const p=P();if(!FB||!p||!p.live||!p.room)return liveMsg?`<p class="note">${esc(liveMsg)}</p>`:"";
  let qr="";try{const q=qrcode(0,"M");q.addData(joinUrl(p.room.id));q.make();qr=q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){}
  return `<div class="share">${qr?`<div class="qr">${qr}</div>`:""}<div class="sharetxt"><span class="steplbl">Room code</span><b class="code">${esc(p.room.id)}</b>
    <span class="note">Players scan this code with their phone camera, or open Initable › “Open the player screen” and type the code.</span>
    <button class="ghost" id="copylink">Copy invite link</button></div></div>`}
(async()=>{try{
  if(window.claude&&window.claude.use){const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(user)IS_OWNER=await user.isOwner();if(!IS_OWNER)ROLE="player";if(!db){render();return}DBX=db;subscribeRemote();render();return}
  await initFirebase()}catch(e){console.warn("cloud",e);render()}})();
// ---------- keep screen on + eco standby ----------
// When "keep screen on" is active, the phone never locks; after ECO_MS without a tap the app shows a near-black
// standby screen (OLED pixels off) with the round and whose turn it is. Any tap wakes it without changing anything.
const ECO_MS=3*60*1000;let KEEP=false,WL=null,wakeFailed=false,ecoT=null;
try{KEEP=localStorage.getItem(KEY+"-awake")==="1"}catch(e){}
function awakeBtn(){return `<button id="awake" class="iconbtn ${KEEP?(wakeFailed?"warn":"on"):""}" aria-pressed="${KEEP}" aria-label="Keep screen on" title="${KEEP?(wakeFailed?"This browser refused to keep the screen on":"Screen stays on, eco standby after 3 min"):"Keep screen on"}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>`}
async function wake(){if(!KEEP||WL||document.visibilityState!=="visible")return;
  try{WL=await navigator.wakeLock.request("screen");wakeFailed=false;WL.addEventListener("release",()=>{WL=null})}catch(e){wakeFailed=true}
  refreshAwake()}
function refreshAwake(){const b=document.getElementById("awake");if(b)b.outerHTML=awakeBtn()}
function setKeep(on){KEEP=on;try{localStorage.setItem(KEY+"-awake",on?"1":"0")}catch(e){}
  if(on)wake();else{WL?.release().catch(()=>{});WL=null;wakeFailed=false;hideEco()}refreshAwake();armEco()}
const eco=document.createElement("div");eco.id="eco";eco.hidden=true;document.body.appendChild(eco);
function showEco(){if(!KEEP||sheet)return;const a=S&&S.inCombat?sorted()[S.turn]:null;
  eco.innerHTML=`<div class="ecoin"><b>${S&&S.inCombat?"Round "+S.round:"Standby"}</b>${a?`<span>${esc(a.mon?a.name:a.name)}’s turn</span>`:""}<small>Tap to wake</small></div>`;eco.hidden=false}
function hideEco(){eco.hidden=true}
function armEco(){clearTimeout(ecoT);if(KEEP)ecoT=setTimeout(showEco,ECO_MS)}
// a tap on the standby screen only wakes it; it never reaches the HP zones underneath
eco.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();hideEco();armEco()},true);
eco.addEventListener("click",e=>{e.stopPropagation()},true);
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(eco.hidden)armEco()},true));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});
document.addEventListener("click",e=>{if(e.target.closest("#awake")){e.stopImmediatePropagation();setKeep(!KEEP)}},true);
if(KEEP){wake();armEco()}
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("portrait").catch(()=>{})}catch(e){}
render();
</script>
